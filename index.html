<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&#x645;&#x633;&#x62a;&#x643;&#x634;&#x641; &#x627;&#x644;&#x648;&#x637;&#x646;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#062B1F; --surf:#0B3A2B; --surf2:#114836; --line:#1F5C45;
  --ink:#EEF2E6; --muted:#A3BCAE; --gold:#D9AE45; --gold-ink:#1E1606;
  --red:#B8432F; --ok:#71D39B; --bad:#E57A62; --ivory:#F1E6CC;
  --display:'Reem Kufi','Tajawal','Segoe UI',Tahoma,sans-serif;
  --body:'Tajawal','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:0 28px;max-width:1120px;margin:0 auto}

/* Sadu band */
.sadu{height:22px;flex:none;
  background:
    linear-gradient(135deg,var(--red) 25%,transparent 25%) -11px 0/22px 22px,
    linear-gradient(225deg,var(--red) 25%,transparent 25%) -11px 0/22px 22px,
    linear-gradient(315deg,var(--ivory) 25%,transparent 25%) 0 0/22px 22px,
    linear-gradient(45deg,var(--ivory) 25%,var(--bg) 25%) 0 0/22px 22px;
  border-bottom:4px solid var(--gold)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-size:24px;font-weight:700;color:var(--gold)}
.brand span{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;font-weight:700}
.chip small{color:var(--muted);font-weight:500}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted);font-size:14px}
@media (hover:hover){.ghost:hover{color:var(--ink);border-color:var(--muted)}}

.rail{display:flex;gap:6px;margin-block:4px 18px;list-style:none;padding:0}
.rail li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.rail li::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.rail li.done::before{background:var(--gold)}
.rail li.now::before{background:linear-gradient(90deg,var(--line),var(--gold))}
.rail li.now{color:var(--ink);font-weight:700}
.rail li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{flex:1}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--gold);font-weight:700}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(28px,5vw,46px);font-weight:700}
h2{font-size:clamp(22px,3.6vw,32px);font-weight:600}
p{margin:0}
.lead{color:var(--muted);font-size:18px;max-width:60ch}

/* Start */
.start{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:860px){.start{grid-template-columns:1.25fr .9fr;align-items:start}}
.start-head{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.mapwrap{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px}
.map{width:100%;height:auto;display:block;max-width:560px;margin-inline:auto}
.tile rect{fill:var(--surf2);stroke:var(--line);stroke-width:1.5;transition:fill .2s}
.tile text{fill:var(--ink);font-family:var(--display);font-size:15px;font-weight:600;pointer-events:none}
.tile{cursor:pointer;outline:none}
@media (hover:hover){.tile:hover rect{fill:var(--gold)}.tile:hover text{fill:var(--gold-ink)}}
.tile:focus-visible rect{fill:var(--gold)}
.tile:focus-visible text{fill:var(--gold-ink)}
.desert rect{fill:none;stroke:var(--line);stroke-dasharray:4 5}
.desert text{fill:var(--muted);font-size:13px;font-family:var(--body)}
.maplegend{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-family:var(--display);font-size:20px;margin:0;font-weight:600}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lb li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding-block:9px;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb .rk{font-family:var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lb li:nth-child(1) .rk{color:var(--gold);font-size:20px}
.lb .who{min-width:0}
.lb .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .who small{color:var(--muted);font-size:13px}
.lb .pts{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold)}
.empty{color:var(--muted);font-size:15px}
.hint{color:var(--muted);font-size:13px}

/* Challenge card */
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,34px);display:flex;flex-direction:column;gap:18px;max-width:820px;margin-inline:auto;position:relative}
.kind{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.worth{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.info{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;font-size:20px;line-height:1.8}
.info b{color:var(--gold)}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:60px;text-align:start;background:var(--surf2);border:1.5px solid var(--line);border-radius:14px;padding:12px 18px;font-size:18px;font-weight:500;transition:border-color .15s,background .15s}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--gold)}}
.opt.right{background:color-mix(in srgb,var(--ok) 22%,var(--surf2));border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 20%,var(--surf2));border-color:var(--bad)}
.opt:disabled{cursor:default}
.primary{align-self:flex-start;background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;padding:14px 30px;font-weight:800;font-size:18px}
.primary:hover{filter:brightness(1.08)}
.secondary{background:none;border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;padding:10px 20px;font-weight:700}
.secondary:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.feedback{font-weight:700;font-size:18px;min-height:1.6em}
.feedback.good{color:var(--ok)} .feedback.bad{color:var(--bad)}
.pop{position:absolute;inset-inline-start:24px;top:18px;font-family:var(--display);font-size:28px;color:var(--gold);animation:pop 1.1s ease forwards;pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(10px)}20%{opacity:1}to{opacity:0;transform:translateY(-30px)}}

.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clues li{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:18px;display:flex;gap:12px}
.clues li i{font-style:normal;font-family:var(--display);color:var(--gold);flex:none}
.clues li.locked{color:var(--muted);border-style:dashed}

/* puzzle */
.puzzle{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(100%,380px);aspect-ratio:1;max-width:100%;margin-inline:auto;background:var(--line);padding:4px;border-radius:14px}
.puzzle{grid-template-rows:repeat(3,1fr)}
.pc{position:relative;border:0;border-radius:6px;background-size:300% 300%;background-repeat:no-repeat;padding:0;min-height:0;touch-action:manipulation;transition:transform .15s,outline-color .15s;outline:3px solid transparent}
.pc.sel{outline-color:var(--gold);transform:scale(.94)}
.pc .ok{position:absolute;top:4px;inset-inline-end:4px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:800;display:none;place-items:center;line-height:1}
.pc.placed .ok{display:grid}
.puzzle.solved .pc .ok{display:none}
.puzzle.solved .pc{border-radius:0}
.puzzle.solved{gap:0;padding:0;overflow:hidden}
.ref{width:84px;height:84px;border-radius:8px;border:1px solid var(--line);flex:none}

/* compass */
.compass{position:relative;width:min(100%,320px);aspect-ratio:1;margin-inline:auto}
.compass::before{content:"";position:absolute;inset:18%;border-radius:50%;border:2px dashed var(--line);
  background:radial-gradient(circle,var(--surf2) 0 18%,transparent 19%)}
.compass .dot{position:absolute;inset:0;margin:auto;width:66px;height:66px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;color:var(--gold);line-height:1.2}
.cbtn{position:absolute;width:74px;height:48px;margin:-24px -37px;border-radius:12px;background:var(--surf2);border:1.5px solid var(--line);font-size:14px;font-weight:700;line-height:1.1;padding:2px}
@media (hover:hover){.cbtn:hover:not(:disabled){border-color:var(--gold)}}
.cbtn.right{background:color-mix(in srgb,var(--ok) 25%,var(--surf2));border-color:var(--ok)}
.cbtn.wrong{background:color-mix(in srgb,var(--bad) 22%,var(--surf2));border-color:var(--bad)}

/* paths */
.paths{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.paths{grid-template-columns:repeat(3,1fr)}}
.pathbtn{text-align:start;background:var(--surf2);border:1.5px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:170px}
@media (hover:hover){.pathbtn:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surf2))}}
.pathbtn b{font-family:var(--display);font-size:26px;color:var(--gold);font-weight:600}
.pathbtn span{color:var(--muted)}
.glyph{width:44px;height:44px}
.glyph *{fill:none;stroke:var(--ivory);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.timer{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%;transform-origin:right;transition:transform .25s linear}
.timer.low i{background:var(--bad)}
.secs{font-variant-numeric:tabular-nums;font-weight:800}

/* result */
.result{display:grid;gap:22px;grid-template-columns:1fr;max-width:980px;margin-inline:auto}
@media (min-width:820px){.result{grid-template-columns:1.2fr .8fr;align-items:start}}
.badge{background:var(--surf);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.badge-top{padding:26px;display:flex;flex-direction:column;gap:8px;background:
  radial-gradient(120% 90% at 100% 0,color-mix(in srgb,var(--gold) 22%,transparent),transparent 60%)}
.badge-title{font-family:var(--display);font-size:clamp(26px,4.4vw,40px);color:var(--gold);font-weight:700;text-wrap:balance;line-height:1.3}
.big{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-family:var(--body)}
.brk{list-style:none;margin:0;padding:0 26px 22px;display:flex;flex-direction:column}
.brk li{display:flex;justify-content:space-between;padding-block:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.brk li span:last-child{font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.field input{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);font-size:18px;width:100%}
.qr{background:var(--ivory);border-radius:14px;padding:12px;width:180px;max-width:100%;align-self:center}
.qr svg{display:block;width:100%;height:auto}
.note{font-size:14px;color:var(--muted)}

/* board screen */
.board{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:900px){.board{grid-template-columns:1.4fr 1fr}}
.board .lb li{padding-block:14px;font-size:22px}
.board .lb .pts{font-size:26px}
.board .lb .rk{font-size:22px}
.live{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.live li{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.live b{font-family:var(--display);font-size:20px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    const txt=await r.text(); let list=[]; lastSharedAt=0;
    txt.split('\n').forEach(line=>{ if(!line.trim()) return; try{const m=JSON.parse(line);
      if(m.event==='message'&&m.message){const d=JSON.parse(m.message); if(Array.isArray(d.s)){list=d.s; lastSharedAt=(m.time||0)*1000;}}}catch(e){} });
    return list.map(x=>({name:x.n,title:x.t,score:x.p,at:x.a}));
  }catch(e){window.__boardErr='GET '+(e&&e.message||e); return null}
}
async function publishShared(list){

  do{ body=JSON.stringify({s:top.map(r=>({n:String(r.name||'').slice(0,20),t:r.title||'',p:r.score,a:r.at||0}))}); top=top.slice(0,-1);}
  while(new Blob([body]).size>3800 && top.length);

  if(!r.ok) window.__boardErr='POST '+r.status;

}

      <div class="mapwrap">${mapSVG()}<div class="maplegend"><span>\u25b2 \u0627\u0644\u0634\u0645\u0627\u0644</span><span>\u062e\u0631\u064a\u0637\u0629 \u0645\u0628\u0633\u0637\u0629: \u0643\u0644 \u0645\u0631\u0628\u0639 \u0645\u0646\u0637\u0642\u0629 \u0625\u062f\u0627\u0631\u064a\u0629</span></div></div>
    </div>
    <aside class="panel"><h3>\u0623\u0639\u0644\u0649 \u0627\u0644\u0646\u0642\u0627\u0637</h3><div id="miniLb">${lbHTML(board,5)}</div><p class="hint">\u0623\u0639\u0644\u0649 \u0646\u062a\u064a\u062c\u0629 \u0645\u0645\u0643\u0646\u0629 \u0661\u0661\u0665\u0660 \u0646\u0642\u0637\u0629.</p></aside>
  </section>`;
  stage.querySelectorAll('.tile').forEach(t=>{
    const go=()=>startRegion(t.dataset.id);
    t.onclick=go; t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  });
  boardListeners.clear(); boardListeners.add(()=>{const m=$('#miniLb'); if(m) m.innerHTML=lbHTML(board,5);});
}
function startRegion(id){
  S={region:REGIONS.find(r=>r.id===id),step:0,score:0,path:null,log:[]};
  renderStep();
}
function clearTimers(){ if(S&&S.tick) clearInterval(S.tick); clearTimeout(idleTimer); }

/* ============ STEPS ============ */
function renderStep(){
  renderTop(); pushPresence(); window.scrollTo({top:0});
  [stepInfo,stepLandmark,stepPuzzle,stepCompass,stepPath,stepFinal][S.step]();
}
function next(){ S.step++; renderStep(); }
function nextBtn(label){return `<button class="primary" id="nextBtn">${label||'\u0627\u0644\u062a\u0627\u0644\u064a'}</button>`;}

function mcq(container, opts, onAnswer){
  const order = shuffle(opts.map((t,i)=>({t,ok:i===0})));
  container.innerHTML = order.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('');
  container.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=order[+b.dataset.i];
    container.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true; if(order[j].ok) x.classList.add('right');});
    if(!o.ok) b.classList.add('wrong');
    onAnswer(o.ok);
  });
  return ()=>{ // lock (timeout)
    container.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true; if(order[j].ok) x.classList.add('right');});
  };
}
function finishStep(card, ok, pts, label, goodMsg, badMsg){
  S.log.push({label,pts:ok?pts:0});
  if(ok) addPoints(pts, card);
  const fb=card.querySelector('.feedback');
  fb.className='feedback '+(ok?'good':'bad');
  fb.textContent = ok?goodMsg:badMsg;
  card.querySelector('.after').innerHTML = nextBtn(S.step===5?'\u0634\u0627\u0647\u062f \u0646\u062a\u064a\u062c\u062a\u0643':'\u0627\u0644\u062a\u0627\u0644\u064a');
  $('#nextBtn').onclick = S.step===5?showResult:next; $('#nextBtn').focus();
}

/* 1. info */
function stepInfo(){
  const d=S.region.info;
  stage.innerHTML=`<section class="card" id="card">
    <div class="kind"><span class="eyebrow">\u0627\u0644\u0645\u062d\u0637\u0629 \u0661 \u00b7 \u0645\u0639\u0644\u0648\u0645\u0629</span><span class="worth">\u0661\u0665\u0660 \u0646\u0642\u0637\u0629</span></div>
    <h2>\u0627\u0642\u0631\u0623 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0629 \u062c\u064a\u062f\u064b\u0627\u060c \u062b\u0645 \u0623\u062c\u0628</h2>
    <div class="info">${d.text}</div>
    <div class="after">${nextBtn('\u062c\u0627\u0647\u0632 \u0644\u0644\u0633\u0624\u0627\u0644')}</div>
  </section>`;
  $('#nextBtn').onclick=()=>{
    const card=$('#card');
    card.innerHTML=`<div class="kind"><span class="eyebrow">\u0627\u0644\u0645\u062d\u0637\u0629 \u0661 \u00b7 \u0645\u0639\u0644\u0648\u0645\u0629</span><span class="worth">\u0661\u0665\u0660 \u0646\u0642\u0637\u0629</span></div>
      <h2>${esc(d.q)}</h2><div class="opts" id="opts"></div><p class="feedback" aria-live="polite"></p><div class="after"></div>`;
    mcq($('#opts'),d.opts,ok=>finishStep(card,ok,150,'\u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0629','\u0625\u062c\u0627\u0628\u0629 \u0635\u062d\u064a\u062d\u0629! \u0630\u0627\u0643\u0631\u0629 \u0645\u0633\u062a\u0643\u0634\u0641.','\u0644\u064a\u0633\u062a \u0647\u0630\u0647. \u0627\u0644\u0625\u062c\u0627\u0628\u0629 \u0627\u0644\u0635\u062d\u064a\u062d\u0629 \u0645\u0638\u0644\u0644\u0629.'));
  };
}

/* 2. landmark */
function stepLandmark(){
  const d=S.region.land; let shown=1;
  stage.innerHTML=`<section class="card" id="card">
    <div class="kind"><span class="eyebrow">\u0627\u0644\u0645\u062d\u0637\u0629 \u0662 \u00b7 \u062a\u0639\u0631\u0651\u0641 \u0639\u0644\u0649 \u0627\u0644\u0645\u0639\u0644\u0645</span><span class="worth" id="worth">\u0663\u0660\u0660 \u0646\u0642\u0637\u0629</span></div>
    <h2>\u0645\u0627 \u0647\u0630\u0627 \u0627\u0644\u0645\u0639\u0644\u0645 \u0641\u064a ${esc(S.region.name)}\u061f</h2>
    <ol class="clues" id="clues"></ol>
    <div class="row"><button class="secondary" id="more">\u062a\u0644\u0645\u064a\u062d \u0625\u0636\u0627\u0641\u064a (\u2212\u0661\u0660\u0660)</button></div>
    <div class="opts" id="opts"></div><p class="feedback" aria-live="polite"></p><div class="after"></div>
  </section>`;
  const worthTxt=['\u0663\u0660\u0660','\u0662\u0660\u0660','\u0661\u0660\u0660'];
  const draw=()=>{
    $('#clues').innerHTML=d.clues.map((c,i)=>i<shown?`<li><i>${i+1}</i>${esc(c)}</li>`:`<li class="locked"><i>${i+1}</i>\u062a\u0644\u0645\u064a\u062d \u0645\u062e\u0641\u064a</li>`).join('');
    $('#worth').textContent=worthTxt[shown-1]+' \u0646\u0642\u0637\u0629';
    $('#more').disabled = shown>=3;
  };
  draw();
  $('#more').onclick=()=>{shown++;draw();};
  const card=$('#card');
  mcq($('#opts'),d.opts,ok=>{$('#more').disabled=true;shown=Math.max(shown,1);
    finishStep(card,ok,[300,200,100][shown-1],'\u0627\u0644\u0645\u0639\u0644\u0645','\u0623\u062d\u0633\u0646\u062a! \u0639\u0631\u0641\u062a\u0647 \u0645\u0646 '+(shown===1?'\u0623\u0648\u0644 \u062a\u0644\u0645\u064a\u062d.':shown+' \u062a\u0644\u0645\u064a\u062d\u0627\u062a.'),'\u0641\u0627\u062a\u0643 \u0647\u0630\u0647 \u0627\u0644\u0645\u0631\u0629. \u0627\u0644\u0645\u0639\u0644\u0645 \u0647\u0648 \u00ab'+d.opts[0]+'\u00bb.');
    shown=3; $('#clues').innerHTML=d.clues.map((c,i)=>`<li><i>${i+1}</i>${esc(c)}</li>`).join('');});
}

/* 3. puzzle */
function puzzleImage(){
  const c=document.createElement('canvas'); c.width=c.height=600; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,600,600); g.addColorStop(0,'#0E4A35'); g.addColorStop(1,'#06291D');
  x.fillStyle=g; x.fillRect(0,0,600,600);
  // sadu diamonds
  const band=(y,h)=>{for(let i=-1;i<13;i++){const cx=i*50+25;
    x.fillStyle=i%2?'#B8432F':'#F1E6CC'; x.beginPath(); x.moveTo(cx,y); x.lineTo(cx+25,y+h/2); x.lineTo(cx,y+h); x.lineTo(cx-25,y+h/2); x.closePath(); x.fill();}
    x.fillStyle='#D9AE45'; x.fillRect(0,y-6,600,6); x.fillRect(0,y+h,600,6);};
  band(40,60); band(500,60);
  // palm + sun motif
  x.strokeStyle='#D9AE45'; x.lineWidth=6; x.beginPath(); x.arc(470,190,46,0,Math.PI*2); x.stroke();
  x.strokeStyle='#71D39B'; x.lineWidth=8; x.beginPath(); x.moveTo(120,470); x.quadraticCurveTo(128,330,112,230); x.stroke();
  for(let k=0;k<6;k++){const a=-Math.PI/2+(k-2.5)*0.5; x.beginPath(); x.moveTo(112,230); x.quadraticCurveTo(112+Math.cos(a)*50,230+Math.sin(a)*50-10,112+Math.cos(a)*95,230+Math.sin(a)*95+25); x.stroke();}
  x.direction='rtl'; x.textAlign='center'; x.fillStyle='#EEF2E6';
  x.font='700 92px "Reem Kufi", Tajawal, sans-serif'; x.fillText(S.region.name,330,330);
  x.fillStyle='#D9AE45'; x.font='700 40px Tajawal, sans-serif'; x.fillText(S.region.landmark,330,405);
  return c.toDataURL('image/png');
}
async function stepPuzzle(){
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,800))]);}catch(e){}
  if(!S||S.step!==2) return;
  const src=puzzleImage();
  let img=src; try{const blob=await new Promise(r=>{const c=new Image();c.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=600;cv.getContext('2d').drawImage(c,0,0);cv.toBlob(r,'image/png');};c.onerror=()=>r(null);c.src=src;}); if(blob) img=URL.createObjectURL(blob);}catch(e){}
  let order; do{order=shuffle([0,1,2,3,4,5,6,7,8]);}while(order.filter((v,i)=>v===i).length>2);
  let sel=null, moves=0, over=false;
  stage.innerHTML=`<section class="card" id="card">
    <div class="kind"><span class="eyebrow">\u0627\u0644\u0645\u062d\u0637\u0629 \u0663 \u00b7 \u0631\u0643\u0651\u0628 \u0627\u0644\u0644\u063a\u0632</span><span class="worth">\u062d\u062a\u0649 \u0662\u0660\u0660 \u0646\u0642\u0637\u0629</span></div>
    <h2>\u0631\u062a\u0651\u0628 \u0627\u0644\u0642\u0637\u0639 \u0644\u062a\u0643\u062a\u0645\u0644 \u0635\u0648\u0631\u0629 ${esc(S.region.name)}</h2>
    <div class="row"><img class="ref" src="${img}" alt="\u0627\u0644\u0635\u0648\u0631\u0629 \u0627\u0644\u0645\u0643\u062a\u0645\u0644\u0629 \u0644\u0644\u0645\u0642\u0627\u0631\u0646\u0629"><p class="hint">\u0627\u0636\u063a\u0637 \u0642\u0637\u0639\u0629 \u062b\u0645 \u0642\u0637\u0639\u0629 \u0623\u062e\u0631\u0649 \u0644\u062a\u0628\u062f\u064a\u0644 \u0645\u0643\u0627\u0646\u0647\u0645\u0627. \u0627\u0644\u0642\u0637\u0639\u0629 \u0627\u0644\u0644\u064a \u0641\u064a \u0645\u0643\u0627\u0646\u0647\u0627 \u0627\u0644\u0635\u062d\u064a\u062d \u062a\u0638\u0647\u0631 \u0639\u0644\u064a\u0647\u0627 \u0639\u0644\u0627\u0645\u0629 \u2713.<br>\u0627\u0644\u062d\u0631\u0643\u0627\u062a: <b id="moves">0</b></p></div>
    <div class="puzzle" id="pz">${order.map((_,i)=>`<button class="pc" data-i="${i}" aria-label="\u0642\u0637\u0639\u0629 ${i+1}" style="background-image:url('${img}')"><span class="ok">\u2713</span></button>`).join('')}</div>
    <div class="row"><button class="secondary" id="skip" hidden>\u062a\u062e\u0637\u064e\u0651 \u0627\u0644\u0644\u063a\u0632 (+\u0665\u0660)</button></div>
    <p class="feedback" aria-live="polite"></p><div class="after"></div>
  </section>`;
  const pz=$('#pz'), card=$('#card'), btns=[...pz.querySelectorAll('.pc')];
  const draw=()=>btns.forEach((b,i)=>{const p=order[i];
    b.style.backgroundPosition=`${(p%3)*50}% ${Math.floor(p/3)*50}%`;
    b.classList.toggle('sel',sel===i); b.classList.toggle('placed',p===i);});
  const end=(pts,msg)=>{over=true; btns.forEach(b=>b.disabled=true); $('#skip').hidden=true;
    finishStep(card,true,pts,'\u0627\u0644\u0644\u063a\u0632',msg,'');};
  btns.forEach((b,i)=>b.addEventListener('click',()=>{
    if(over) return;
    if(sel===null){sel=i;draw();return;}
    if(sel!==i){[order[sel],order[i]]=[order[i],order[sel]];moves++;$('#moves').textContent=moves;}
    sel=null;draw();
    if(moves>=15) $('#skip').hidden=false;
    if(order.every((v,k)=>v===k)){pz.classList.add('solved');
      end(Math.max(80,200-Math.max(0,moves-8)*15),'\u0627\u0643\u062a\u0645\u0644\u062a \u0627\u0644\u0635\u0648\u0631\u0629 \u0641\u064a '+moves+' \u062d\u0631\u0643\u0629!');}
  }));
  $('#skip').onclick=()=>{order=order.map((_,k)=>k);draw();pz.classList.add('solved');end(50,'\u0631\u062a\u0651\u0628\u0646\u0627\u0647\u0627 \u0644\u0643. \u0646\u0643\u0645\u0644 \u0627\u0644\u0631\u062d\u0644\u0629!');};
  draw();
}

/* 4. compass */
function stepCompass(){
  const d=S.region.comp;
  stage.innerHTML=`<section class="card" id="card">
    <div class="kind"><span class="eyebrow">\u0627\u0644\u0645\u062d\u0637\u0629 \u0664 \u00b7 \u062d\u062f\u0651\u062f \u0627\u0644\u0645\u0648\u0642\u0639</span><span class="worth">\u0661\u0665\u0660 \u0646\u0642\u0637\u0629</span></div>
    <h2>\u0641\u064a \u0623\u064a \u0627\u062a\u062c\u0627\u0647 \u062a\u0642\u0639 ${esc(d.to)} \u0645\u0646 ${esc(d.from)}\u061f</h2>
    <p class="hint">\u062a\u062e\u064a\u0651\u0644 \u0623\u0646\u0643 \u0648\u0627\u0642\u0641 \u0641\u064a ${esc(d.from)} (\u0648\u0633\u0637 \u0627\u0644\u0628\u0648\u0635\u0644\u0629)\u060c \u0648\u0627\u062e\u062a\u0631 \u0627\u0644\u0627\u062a\u062c\u0627\u0647.</p>
    <div class="compass" id="cmp"><div class="dot">${esc(d.from)}</div>${Object.keys(DIRS).map(k=>`<button class="cbtn" data-k="${k}" style="left:${DIRPOS[k][0]}%;top:${DIRPOS[k][1]}%">${DIRS[k]}</button>`).join('')}</div>
    <p class="feedback" aria-live="polite"></p><div class="after"></div>
  </section>`;
  const card=$('#card');
  card.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.k===d.a;
    card.querySelectorAll('.cbtn').forEach(x=>{x.disabled=true; if(x.dataset.k===d.a) x.classList.add('right');});
    if(!ok) b.classList.add('wrong');
    finishStep(card,ok,150,'\u0627\u0644\u0645\u0648\u0642\u0639','\u0635\u062d\u064a\u062d! '+d.to+' \u062a\u0642\u0639 '+DIRS[d.a]+' '+d.from+'.','\u0642\u0631\u064a\u0628! '+d.to+' \u062a\u0642\u0639 '+DIRS[d.a]+' '+d.from+'.');
  });
}

/* 5. path */
function stepPath(){
  stage.innerHTML=`<section class="card" style="max-width:980px">
    <div class="kind"><span class="eyebrow">\u0627\u0644\u0645\u062d\u0637\u0629 \u0665 \u00b7 \u0627\u062e\u062a\u0631 \u0645\u0633\u0627\u0631\u0643</span></div>
    <h2>\u0648\u0634 \u0627\u0644\u062c\u0627\u0646\u0628 \u0627\u0644\u0644\u064a \u062a\u0628\u064a \u062a\u0633\u062a\u0643\u0634\u0641\u0647 \u0645\u0646 ${esc(S.region.name)}\u061f</h2>
    <div class="paths">${Object.entries(PATHS).map(([k,p])=>`<button class="pathbtn" data-k="${k}"><svg class="glyph" viewBox="0 0 44 44" aria-hidden="true">${p.svg}</svg><b>${p.label}</b><span>${p.desc}</span></button>`).join('')}</div>
  </section>`;
  stage.querySelectorAll('.pathbtn').forEach(b=>b.onclick=()=>{S.path=b.dataset.k;next();});
}

/* 6. final */
function stepFinal(){
  const d=S.region[S.path], P=PATHS[S.path], LIMIT=20;
  stage.innerHTML=`<section class="card" id="card">
    <div class="kind"><span class="eyebrow">\u0627\u0644\u0645\u062d\u0637\u0629 \u0666 \u00b7 \u0627\u0644\u062a\u062d\u062f\u064a \u0627\u0644\u0623\u062e\u064a\u0631 \u00b7 \u0645\u0633\u0627\u0631 ${P.label}</span><span class="worth">\u0662\u0665\u0660 + \u0645\u0643\u0627\u0641\u0623\u0629 \u0633\u0631\u0639\u0629</span></div>
    <div class="row" style="justify-content:space-between"><span class="hint">\u0627\u0644\u0648\u0642\u062a \u0627\u0644\u0645\u062a\u0628\u0642\u064a</span><span class="secs" id="secs">${LIMIT}</span></div>
    <div class="timer" id="timer"><i id="bar"></i></div>
    <h2>${esc(d.q)}</h2><div class="opts" id="opts"></div><p class="feedback" aria-live="polite"></p><div class="after"></div>
  </section>`;
  const card=$('#card'); const t0=Date.now(); let done=false;
  const lock=mcq($('#opts'),d.opts,ok=>{
    if(done) return; done=true; clearInterval(S.tick);
    const left=Math.max(0,LIMIT-(Date.now()-t0)/1000); const bonus=Math.round(left*5);
    finishStep(card,ok,250+bonus,'\u0627\u0644\u062a\u062d\u062f\u064a \u0627\u0644\u0623\u062e\u064a\u0631',ok?'\u0631\u0627\u0626\u0639! +\u0662\u0665\u0660 \u0648\u0645\u0643\u0627\u0641\u0623\u0629 \u0633\u0631\u0639\u0629 '+bonus+'.':'',
      '\u0627\u0644\u0625\u062c\u0627\u0628\u0629 \u0627\u0644\u0635\u062d\u064a\u062d\u0629: '+d.opts[0]+'.');
  });
  S.tick=setInterval(()=>{
    const left=Math.max(0,LIMIT-(Date.now()-t0)/1000);
    $('#secs').textContent=Math.ceil(left); $('#bar').style.transform=`scaleX(${left/LIMIT})`;
    if(left<6) $('#timer').classList.add('low');
    if(left<=0&&!done){done=true;clearInterval(S.tick);lock();finishStep(card,false,0,'\u0627\u0644\u062a\u062d\u062f\u064a \u0627\u0644\u0623\u062e\u064a\u0631','','\u0627\u0646\u062a\u0647\u0649 \u0627\u0644\u0648\u0642\u062a! \u0627\u0644\u0625\u062c\u0627\u0628\u0629: '+d.opts[0]+'.');}
  },200);
}

/* ============ RESULT ============ */
function resultTitle(){return PATHS[S.path].title+' '+S.region.name;}
function showResult(){
  clearTimers(); S.step=6; renderTop();
  $('#rail').querySelectorAll('li').forEach(li=>li.className='done');
  const title=resultTitle();
  const qrText=`\u0645\u0633\u062a\u0643\u0634\u0641 \u0627\u0644\u0648\u0637\u0646 | \u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0648\u0637\u0646\u064a \u0627\u0644\u0633\u0639\u0648\u062f\u064a 96\n${title}\n\u0627\u0644\u0646\u0642\u0627\u0637: ${S.score}`;
  let qrSvg='';
  try{ if(window.qrcode){ qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8']; const q=qrcode(0,'M'); q.addData(qrText,'Byte'); q.make(); qrSvg=q.createSvgTag({cellSize:4,margin:2,scalable:true}); } }catch(e){qrSvg='';}
  stage.innerHTML=`<section class="result">
    <div class="badge">
      <div class="badge-top"><span class="eyebrow">\u0627\u0643\u062a\u0645\u0644\u062a \u0631\u062d\u0644\u062a\u0643</span>
        <div class="badge-title">${esc(title)}</div>
        <div class="big">${nf(S.score)} <small>\u0646\u0642\u0637\u0629</small></div>
        <p class="lead">\u0623\u0643\u0645\u0644\u062a \u0631\u062d\u0644\u0629 ${PATHS[S.path].label} \u0641\u064a ${esc(S.region.name)} \u0628\u0646\u062c\u0627\u062d!</p></div>
      <ul class="brk">${S.log.map(l=>`<li><span>${l.label}</span><span>${l.pts?'+'+nf(l.pts):'0'}</span></li>`).join('')}</ul>
    </div>
    <aside class="panel">
      <h3>\u0633\u062c\u0651\u0644 \u0627\u0633\u0645\u0643 \u0641\u064a \u0644\u0648\u062d\u0629 \u0627\u0644\u0645\u062a\u0635\u062f\u0631\u064a\u0646</h3>
      <div class="field"><label for="pname">\u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0630\u064a \u064a\u0638\u0647\u0631 \u0639\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629</label><input id="pname" maxlength="20" autocomplete="off" placeholder="\u0627\u0644\u0627\u0633\u0645"></div>
      <div class="row"><button class="primary" id="saveScore">\u0633\u062c\u0651\u0644 \u0627\u0644\u0646\u062a\u064a\u062c\u0629</button></div>
      <p class="feedback" id="saveMsg" aria-live="polite"></p>
      ${qrSvg?`<div class="qr" aria-label="\u0631\u0645\u0632 QR \u0628\u0646\u062a\u064a\u062c\u062a\u0643">${qrSvg}</div><p class="note" style="text-align:center">\u0627\u0645\u0633\u062d \u0627\u0644\u0631\u0645\u0632 \u0644\u062a\u062d\u062a\u0641\u0638 \u0628\u0646\u062a\u064a\u062c\u062a\u0643</p>`:''}
      <div class="row"><button class="secondary" id="saveCard" ${downloads?'':'hidden'}>\u0627\u062d\u0641\u0638 \u0628\u0637\u0627\u0642\u062a\u064a</button><button class="secondary" id="again">\u0631\u062d\u0644\u0629 \u062c\u062f\u064a\u062f\u0629</button></div>
    </aside>
  </section>`;
  $('#again').onclick=goStart;
  $('#saveCard').onclick=saveCard;
  $('#saveScore').onclick=async()=>{
    const name=($('#pname').value||'').trim().slice(0,20)||'\u0632\u0627\u0626\u0631';
    const entry={name,region:S.region.name,path:PATHS[S.path].label,title,score:S.score,at:Date.now()};
    $('#saveScore').disabled=true; S.name=name; pushPresence();
    window.__boardErr=''; const okShared=await pushShared(entry);
    saveLocal(entry);
    if(okShared) await refreshShared();
    let msg=(!okShared)?'\u062a\u0639\u0630\u0651\u0631 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0644\u0648\u062d\u0629 \u0627\u0644\u0645\u062a\u0635\u062f\u0631\u064a\u0646 \u0627\u0644\u0645\u0634\u062a\u0631\u0643\u0629\u060c \u062d\u064f\u0641\u0638\u062a \u0646\u062a\u064a\u062c\u062a\u0643 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u062c\u0647\u0627\u0632. ('+(window.__boardErr||'?')+') ':'';
    msg+='\u062a\u0645 \u062a\u0633\u062c\u064a\u0644 \u0646\u062a\u064a\u062c\u062a\u0643!';
    const rank=[...board,entry].sort((a,b)=>b.score-a.score).findIndex(r=>r===entry||(r.at===entry.at&&r.name===entry.name))+1;
    $('#saveMsg').className='feedback good'; $('#saveMsg').textContent=msg+(rank&&rank<=10?' \u062a\u0631\u062a\u064a\u0628\u0643 \u0627\u0644\u062d\u0627\u0644\u064a: '+rank:'');
    armIdle();
  };
  pushPresence(); armIdle();
}
function armIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if(S&&S.step===6) goStart(); },120000); }
async function saveCard(){
  try{await document.fonts.ready;}catch(e){}
  const c=document.createElement('canvas'); c.width=1080; c.height=1350; const x=c.getContext('2d');
  x.fillStyle='#062B1F'; x.fillRect(0,0,1080,1350);
  for(let i=-1;i<24;i++){const cx=i*48+24; x.fillStyle=i%2?'#B8432F':'#F1E6CC'; x.beginPath(); x.moveTo(cx,40); x.lineTo(cx+24,70); x.lineTo(cx,100); x.lineTo(cx-24,70); x.closePath(); x.fill();}
  x.fillStyle='#D9AE45'; x.fillRect(0,106,1080,8);
  x.direction='rtl'; x.textAlign='center';
  x.fillStyle='#A3BCAE'; x.font='500 40px Tajawal, sans-serif'; x.fillText('\u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0648\u0637\u0646\u064a \u0627\u0644\u0633\u0639\u0648\u062f\u064a \u0669\u0666',540,250);
  x.fillStyle='#D9AE45'; x.font='700 84px "Reem Kufi", Tajawal, sans-serif';
  const title=resultTitle(); const words=title.split(' '); const mid=Math.ceil(words.length/2);
  x.fillText(words.slice(0,mid).join(' '),540,470); x.fillText(words.slice(mid).join(' '),540,580);
  x.fillStyle='#EEF2E6'; x.font='700 200px "Reem Kufi", Tajawal, sans-serif'; x.fillText(nf(S.score),540,860);
  x.fillStyle='#A3BCAE'; x.font='500 48px Tajawal, sans-serif'; x.fillText('\u0646\u0642\u0637\u0629',540,940);
  x.fillStyle='#EEF2E6'; x.font='500 44px Tajawal, sans-serif'; x.fillText((S.name?S.name+' \u00b7 ':'')+'\u0623\u0643\u0645\u0644 \u0631\u062d\u0644\u0629 '+PATHS[S.path].label+' \u0628\u0646\u062c\u0627\u062d',540,1100);
  x.fillStyle='#D9AE45'; x.font='700 40px "Reem Kufi", Tajawal, sans-serif'; x.fillText('\u0645\u0633\u062a\u0643\u0634\u0641 \u0627\u0644\u0648\u0637\u0646',540,1250);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='mustakshif-alwatan.png'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/* ============ BOARD SCREEN ============ */
function showBoard(){
  clearTimers(); S=null; renderTop();
  $('#topright').innerHTML=`<button class="ghost" id="back">\u0627\u0644\u0639\u0648\u062f\u0629 \u0644\u0644\u062a\u062c\u0631\u0628\u0629</button>`;
  $('#back').onclick=goStart;
  stage.innerHTML=`<section class="board">
    <div class="panel"><span class="eyebrow">\u0644\u0648\u062d\u0629 \u0627\u0644\u0645\u062a\u0635\u062f\u0631\u064a\u0646</span><h2>\u0623\u0639\u0644\u0649 \u0661\u0660 \u0645\u0633\u062a\u0643\u0634\u0641\u064a\u0646</h2><div id="bigLb">${lbHTML(board,10)}</div></div>
    <div class="panel"><span class="eyebrow">\u0645\u0628\u0627\u0634\u0631</span><h2>\u064a\u0644\u0639\u0628 \u0627\u0644\u0622\u0646</h2><ul class="live" id="live"></ul>
      <p class="hint">\u0627\u0641\u062a\u062d \u0627\u0644\u062a\u062c\u0631\u0628\u0629 \u0641\u064a \u0646\u0627\u0641\u0630\u0629 \u062b\u0627\u0646\u064a\u0629 \u0639\u0644\u0649 \u0646\u0641\u0633 \u0627\u0644\u062c\u0647\u0627\u0632\u060c \u0648\u062a\u0638\u0647\u0631 \u0631\u062d\u0644\u0629 \u0627\u0644\u0644\u0627\u0639\u0628 \u0647\u0646\u0627 \u0645\u0628\u0627\u0634\u0631\u0629.</p></div>
  </section>`;
  boardListeners.clear(); boardListeners.add(()=>{const m=$('#bigLb'); if(m) m.innerHTML=lbHTML(board,10);});
  const drawLive=()=>{const l=$('#live'); if(!l) return;
    const list=peers.filter(p=>!p.isMe);
    l.innerHTML=list.length?list.map(p=>{const s=p.presence;return `<li><span class="pulse"></span><span style="flex:1;min-width:0"><b>${esc(s.name||'\u0632\u0627\u0626\u0631')}</b><br><small class="hint">${esc(s.region||'')} \u00b7 ${esc(s.step||'')}${s.path?' \u00b7 '+esc(s.path):''}</small></span><span class="pts" style="color:var(--gold);font-weight:800">${nf(s.score||0)}</span></li>`;}).join(''):
      `<li><span class="hint">\u0644\u0627 \u0623\u062d\u062f \u064a\u0644\u0639\u0628 \u0627\u0644\u0622\u0646.</span></li>`;};
  peerListeners.clear(); peerListeners.add(drawLive); drawLive();
}

function route(){ if(/board/i.test(location.hash)||/board/i.test(location.search)) showBoard(); else if(!S) goStart(); }
window.addEventListener('hashchange',route);
route();
refreshShared(); setInterval(refreshShared,8000);
</script>
